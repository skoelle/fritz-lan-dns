name: Build and Push Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify webhook
        if: env.WEBHOOK_URL != ''
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o webhook-response.json -w "%{http_code}" \
            --connect-timeout 15 --max-time 600 \
            -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $WEBHOOK_TOKEN")
          echo "webhook: HTTP $http_code"
          cat webhook-response.json; echo
          updated=$(jq -r '.summary.updated // 0' webhook-response.json 2>/dev/null || echo 0)
          failed=$(jq -r '.summary.failed // 0' webhook-response.json 2>/dev/null || echo 0)
          echo "updated=$updated failed=$failed"
          if [ "$http_code" != "200" ] || [ "$updated" -le 0 ]; then
            echo "::error::webhook did not update the image (HTTP $http_code, updated=$updated, failed=$failed)"
            exit 1
          fi
